[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wgn"
version = "0.1.0"
description = "WGN: Wavelet-Guided Network reproduction (Ghosh & Naskar, CVPRW 2026)"
requires-python = ">=3.9"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["wgn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
